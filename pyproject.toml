[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paritok-audit"
version = "0.1.0"
description = "Measure what context compression costs you, not just what it saves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["llm", "context-compression", "coding-agents", "paritok", "evaluation"]

dependencies = [
  "paritok[proxy]>=1.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paritok-audit = "paritok_audit.cli:main"

[tool.setuptools.packages.find]
include = ["paritok_audit*"]
